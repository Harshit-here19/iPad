<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RetroPod</title>
    <style>
        :root {
            --body-silver: #d1d1d1;
            --screen-green: #9fb5a3;
            --wheel-white: #f0f0f0;
            --text-dark: #333;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* iPod Chassis */
        .ipod {
            width: 320px;
            height: 520px;
            background: linear-gradient(145deg, #e6e6e6, #bebebe);
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border: 1px solid #999;
        }

        /* LCD Screen */
        .screen {
            width: 260px;
            height: 180px;
            background-color: var(--screen-green);
            border: 5px solid #444;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
            color: #2b3a2e;
        }

        .screen-top {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 1px solid rgba(0,0,0,0.2);
            padding-bottom: 5px;
        }

        .now-playing {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #song-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        #artist-name { font-size: 14px; opacity: 0.8; }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(0,0,0,0.1);
            margin-top: 10px;
        }
        #progress-fill {
            width: 0%;
            height: 100%;
            background: #2b3a2e;
        }

        /* The Click Wheel */
        .wheel-container {
            margin-top: 40px;
            position: relative;
        }

        .wheel {
            width: 210px;
            height: 210px;
            background: var(--wheel-white);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1), inset 0 0 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            transition: transform 0.1s linear;
        }

        .center-button {
            width: 75px;
            height: 75px;
            background: var(--body-silver);
            border-radius: 50%;
            border: 1px solid #aaa;
            cursor: pointer;
            z-index: 10;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.5);
        }

        .wheel-label {
            position: absolute;
            font-size: 13px;
            font-weight: 800;
            color: #888;
            cursor: pointer;
            user-select: none;
        }

        .menu { top: 15px; }
        .next { right: 15px; }
        .prev { left: 15px; }
        .playpause { bottom: 15px; }

        /* File Input Styling */
        #file-input { display: none; }
        .load-btn {
            margin-top: 25px;
            background: #444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="ipod">
    <div class="screen">
        <div class="screen-top">
            <span>RetroPod</span>
            <span id="battery">100%</span>
        </div>
        <div class="now-playing">
            <div id="song-title">No Music</div>
            <div id="artist-name">Select files below</div>
            <div class="progress-container">
                <div id="progress-fill"></div>
            </div>
        </div>
    </div>

    <div class="wheel-container">
        <div class="wheel" id="click-wheel">
            <div class="wheel-label menu" onclick="location.reload()">MENU</div>
            <div class="wheel-label next" onclick="nextTrack()">▶▶</div>
            <div class="wheel-label prev" onclick="prevTrack()">◀◀</div>
            <div class="wheel-label playpause" onclick="togglePlay()">▶||</div>
            <div class="center-button" onclick="togglePlay()"></div>
        </div>
    </div>

    <input type="file" id="file-input" multiple accept="audio/m4a">
    <button class="load-btn" onclick="document.getElementById('file-input').click()">LOAD LIBRARY</button>
</div>

<audio id="player"></audio>

<script>
    const fileInput = document.getElementById('file-input');
    const player = document.getElementById('player');
    const title = document.getElementById('song-title');
    const artist = document.getElementById('artist-name');
    const progress = document.getElementById('progress-fill');
    const wheel = document.getElementById('click-wheel');

    let songs = [];
    let currentIdx = 0;

    // Handle File Selection
    fileInput.onchange = (e) => {
        songs = Array.from(e.target.files);
        if (songs.length > 0) {
            loadTrack(0);
            document.querySelector('.load-btn').style.display = 'none';
        }
    };

    function loadTrack(idx) {
        currentIdx = idx;
        const url = URL.createObjectURL(songs[idx]);
        player.src = url;
        title.innerText = songs[idx].name.split('.')[0];
        artist.innerText = "Local Library";
    }

    function togglePlay() {
        if (!player.src) return;
        player.paused ? player.play() : player.pause();
    }

    function nextTrack() {
        if (songs.length === 0) return;
        currentIdx = (currentIdx + 1) % songs.length;
        loadTrack(currentIdx);
        player.play();
    }

    function prevTrack() {
        if (songs.length === 0) return;
        currentIdx = (currentIdx - 1 + songs.length) % songs.length;
        loadTrack(currentIdx);
        player.play();
    }

    // Progress Bar Logic
    player.ontimeupdate = () => {
        const pct = (player.currentTime / player.duration) * 100;
        progress.style.width = pct + "%";
    };

    player.onended = () => nextTrack();

    // Wheel Spin Simulation (Visual Only)
    let angle = 0;
    wheel.addEventListener('wheel', (e) => {
        e.preventDefault();
        angle += e.deltaY * 0.1;
        wheel.style.transform = `rotate(${angle}deg)`;
    });

    // Touch support for the "Spin" feel on iPhone
    let lastY = 0;
    wheel.addEventListener('touchmove', (e) => {
        let currentY = e.touches[0].clientY;
        angle += (currentY - lastY) * 0.5;
        wheel.style.transform = `rotate(${angle}deg)`;
        lastY = currentY;
    }, {passive: true});

</script>

</body>
</html>
