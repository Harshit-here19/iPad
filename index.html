<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>RetroPod MP3</title>
    <style>
        :root {
            --body-silver: #d1d1d1;
            --screen-green: #9fb5a3;
            --wheel-white: #f5f5f5;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* iPod Chassis */
        .ipod {
            width: 310px;
            height: 500px;
            background: linear-gradient(145deg, #e6e6e6, #bcbcbc);
            border-radius: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border: 1px solid #888;
        }

        /* LCD Screen */
        .screen {
            width: 250px;
            height: 170px;
            background-color: var(--screen-green);
            border: 4px solid #333;
            border-radius: 4px;
            margin-top: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-sizing: border-box;
            color: #2b3a2e;
        }

        .screen-top {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
            border-bottom: 1px solid rgba(0,0,0,0.3);
            padding-bottom: 4px;
            margin-bottom: 20px;
        }

        #song-title { 
            font-size: 17px; 
            font-weight: bold; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        #artist-name { font-size: 13px; margin-top: 5px; opacity: 0.8; }

        /* Progress Bar */
        .progress-box {
            width: 100%;
            height: 12px;
            background: rgba(0,0,0,0.1);
            margin-top: auto;
            border: 1px solid rgba(0,0,0,0.2);
        }
        #progress-fill { width: 0%; height: 100%; background: #2b3a2e; }

        /* The Click Wheel */
        .wheel-area {
            margin-top: 35px;
            position: relative;
        }

        .wheel {
            width: 200px;
            height: 200px;
            background: var(--wheel-white);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            touch-action: none;
            position: relative;
        }

        .center-btn {
            width: 70px;
            height: 70px;
            background: #dcdcdc;
            border-radius: 50%;
            border: 1px solid #bbb;
            z-index: 5;
            cursor: pointer;
            box-shadow: inset 0 2px 3px rgba(255,255,255,0.8);
        }

        .label {
            position: absolute;
            font-size: 12px;
            font-weight: bold;
            color: #aaa;
            user-select: none;
            pointer-events: none;
        }
        .menu { top: 12px; }
        .next { right: 12px; }
        .prev { left: 12px; }
        .playpause { bottom: 12px; }

        /* Invisible hitboxes for buttons on the wheel */
        .hitbox {
            position: absolute;
            width: 50px;
            height: 50px;
            cursor: pointer;
            z-index: 4;
        }
        .hb-menu { top: 0; width: 100%; height: 60px; }
        .hb-next { right: 0; height: 100%; width: 60px; }
        .hb-prev { left: 0; height: 100%; width: 60px; }
        .hb-pp   { bottom: 0; width: 100%; height: 60px; }

        .load-btn {
            margin-top: 25px;
            background: #333;
            color: #eee;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="ipod">
    <div class="screen">
        <div class="screen-top">
            <span>RetroPod</span>
            <span>⚡</span>
        </div>
        <div id="song-title">Music Library</div>
        <div id="artist-name" style="text-align: center;">Press Load</div>
        <div class="progress-box">
            <div id="progress-fill"></div>
        </div>
    </div>

    <div class="wheel-area">
        <div class="wheel" id="wheel">
            <div class="label menu">MENU</div>
            <div class="label next">▶▶</div>
            <div class="label prev">◀◀</div>
            <div class="label playpause">▶||</div>
            
            <!-- Hitboxes -->
            <div class="hitbox hb-menu" onclick="location.reload()"></div>
            <div class="hitbox hb-next" onclick="nextTrack()"></div>
            <div class="hitbox hb-prev" onclick="prevTrack()"></div>
            <div class="hitbox hb-pp" onclick="togglePlay()"></div>
            
            <div class="center-btn" onclick="togglePlay()"></div>
        </div>
    </div>

    <input type="file" id="file-input" multiple accept="audio/mp3,audio/*">
    <button class="load-btn" id="load-btn" onclick="document.getElementById('file-input').click()">SELECT MP3s</button>
</div>

<audio id="audio-element"></audio>

<script>
    const fileInput = document.getElementById('file-input');
    const audio = document.getElementById('audio-element');
    const title = document.getElementById('song-title');
    const artist = document.getElementById('artist-name');
    const progress = document.getElementById('progress-fill');
    const wheel = document.getElementById('wheel');

    let playlist = [];
    let currentIdx = 0;

    fileInput.onchange = (e) => {
        playlist = Array.from(e.target.files);
        if (playlist.length > 0) {
            loadTrack(0);
            document.getElementById('load-btn').style.display = 'none';
        }
    };

    function loadTrack(idx) {
        currentIdx = idx;
        const file = playlist[idx];
        audio.src = URL.createObjectURL(file);
        title.innerText = file.name.replace(/\.[^/.]+$/, "");
        artist.innerText = "MP3 Library Item " + (idx + 1);
    }

    function togglePlay() {
        if (!audio.src) return;
        audio.paused ? audio.play() : audio.pause();
    }

    function nextTrack() {
        if (playlist.length === 0) return;
        currentIdx = (currentIdx + 1) % playlist.length;
        loadTrack(currentIdx);
        audio.play();
    }

    function prevTrack() {
        if (playlist.length === 0) return;
        currentIdx = (currentIdx - 1 + playlist.length) % playlist.length;
        loadTrack(currentIdx);
        audio.play();
    }

    audio.ontimeupdate = () => {
        const pct = (audio.currentTime / audio.duration) * 100;
        progress.style.width = pct + "%";
    };

    audio.onended = () => nextTrack();

    // Wheel Spin Visual Effect
    let angle = 0;
    let startY = 0;

    wheel.addEventListener('touchstart', (e) => {
        startY = e.touches[0].clientY;
    });

    wheel.addEventListener('touchmove', (e) => {
        const currentY = e.touches[0].clientY;
        const diff = startY - currentY;
        angle += diff * 0.5;
        wheel.style.transform = `rotate(${angle}deg)`;
        startY = currentY;
    });
</script>

</body>
</html>
